name: Refresh Scraped Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"  # 1st of every month, 4am UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scraper/requirements.txt"

      - name: Install Python deps + Playwright browser
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        run: python -m scraper.main

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/finals.json public/data/meta.json
          git diff --cached --quiet || git commit -m "chore: update scraped data [skip ci]"
          git push
